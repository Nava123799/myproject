[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signallab"
version = "0.2.0"
description = "Generate test signals and analyse them in the time and frequency domain."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gong Zhuoer", email = "13731599185@163.com" }]
keywords = ["dsp", "fft", "signal-processing", "spectrum", "matplotlib"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
signallab = "signallab.cli:main"

[project.urls]
Homepage = "https://github.com/Nava123799/myproject"
Repository = "https://github.com/Nava123799/myproject"
Issues = "https://github.com/Nava123799/myproject/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/signallab"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["signallab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src"]
branch = true
